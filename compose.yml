# KRNL0 server — Docker Compose (F18, F28, F29).
#
# Easiest: one command writes this file and its .env for you and starts it:
#   Linux, macOS:  curl -fsSL https://github.com/theMindDeveloper/krnl0-server/releases/latest/download/docker.sh | sh
#   Windows:       irm https://github.com/theMindDeveloper/krnl0-server/releases/latest/download/docker.ps1 | iex
#
# By hand:
#   1. Put this file in a folder, e.g. ~/krnl0
#   2. Create a .env next to it (see .env.example) — at least KRNL0_HOSTS and TZ
#   3. docker compose up -d
#   4. docker compose logs krnl0      shows the address and the setup code
#
# Updates: one click in the KRNL0 app (the updater below does it: signed
# releases only, backup first, automatic way back). By hand:
#   docker compose pull && docker compose up -d
# Own domain with automatic Let's Encrypt certificates: see the "domain" profile below.

name: krnl0

services:
  krnl0:
    image: ghcr.io/theminddeveloper/krnl0-server:${KRNL0_VERSION:-latest}
    container_name: krnl0
    restart: unless-stopped
    ports:
      - "${KRNL0_PUBLISH_PORT:-8443}:8443"
    environment:
      TZ: ${TZ:-UTC}
      KRNL0_HOSTS: ${KRNL0_HOSTS:-}
      KRNL0_WEBSITE: ${KRNL0_WEBSITE:-on}
      KRNL0_APP_SYNC: ${KRNL0_APP_SYNC:-on}
      KRNL0_TLS: ${KRNL0_TLS:-self-signed}
      KRNL0_TRUST_PROXY: ${KRNL0_TRUST_PROXY:-off}
      KRNL0_UPDATE_CHECK: ${KRNL0_UPDATE_CHECK:-on}
      # How this server updates (Decision S12): the updater container below.
      KRNL0_UPDATER: docker
      KRNL0_UPDATE_DIR: /update
      KRNL0_IMAGE_TAG: ${KRNL0_VERSION:-latest}
      KRNL0_AUTO_UPDATE: ${KRNL0_AUTO_UPDATE:-off}
    labels:
      krnl0.role: server
    volumes:
      - krnl0-data:/data
      - krnl0-update:/update
    # Hardening (NF4): nothing but /data is writable, no extra privileges.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m

  # The updater (F29, Decision S12): updates the krnl0 container when the owner
  # asks in the app (or at night, when on). It has the Docker socket, so it is
  # kept apart: no ports, never the data volume — only krnl0-update (requests
  # and status). It installs only signed releases, pulled by their digest.
  updater:
    image: ghcr.io/theminddeveloper/krnl0-server:${KRNL0_VERSION:-latest}
    container_name: krnl0-updater
    command: ["updater", "docker"]
    restart: unless-stopped
    # Root for the Docker socket; group 1000 (the server's "node" group) for the
    # krnl0-update volume — with no capabilities, root can't bypass file permissions.
    user: "0:1000"
    labels:
      krnl0.role: updater
    environment:
      TZ: ${TZ:-UTC}
      KRNL0_UPDATE_DIR: /update
      KRNL0_AUTO_UPDATE: ${KRNL0_AUTO_UPDATE:-off}
      # Off here also stops night updates (the server's update check is off too).
      KRNL0_UPDATE_CHECK: ${KRNL0_UPDATE_CHECK:-on}
    volumes:
      - krnl0-update:/update
      - ${KRNL0_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true
    pids_limit: 64
    mem_limit: 256m

  # Own domain: `docker compose --profile domain up -d` with KRNL0_DOMAIN set in .env.
  # Caddy gets and renews a Let's Encrypt certificate (ports 80 and 443 must reach this
  # machine from the internet) and forwards to KRNL0 over HTTPS, trusting only KRNL0's
  # own CA (it sees the public CA certificate, never a private key).
  # With this on, set KRNL0_TRUST_PROXY=on and KRNL0_PUBLISH_PORT=127.0.0.1:8443.
  caddy:
    image: caddy:2-alpine
    profiles: [domain]
    restart: unless-stopped
    depends_on: [krnl0]
    ports:
      - "80:80"
      - "443:443"
    environment:
      KRNL0_DOMAIN: ${KRNL0_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - type: volume
        source: krnl0-data
        target: /krnl0-public
        read_only: true
        volume:
          subpath: public
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

volumes:
  # One name everywhere: `docker run -v krnl0-data:/data` and this file share it.
  # The installer sets KRNL0_VOLUME when an older Compose file named it krnl0_krnl0-data.
  krnl0-data:
    name: ${KRNL0_VOLUME:-krnl0-data}
  krnl0-update:
    name: krnl0-update
  caddy-data:
